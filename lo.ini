message = ໄຟລ໌ນີ້ຖືກສ້າງຂຶ້ນດ້ວຍ Aseprite ເວີຊັນໃໝ່ກວ່າ ເຊິ່ງມີຂໍ້ມູນທີ່ພວກເຮົາບໍ່ສາມາດອ່ານໄດ້ຢ່າງເຕັມທີ່.\n\nມັນຖືກໝາຍໄວ້ເປັນອ່ານໄດ້ຢ່າງດຽວເພື່ອຫຼີກລ່ຽງການສູນເສຍຂໍ້ມູນນັ້ນເມື່ອເຈົ້າພະຍາຍາມບັນທຶກ/ຂຽນທັບ.\n\nເພື່ອແກ້ໄຂສະຖານະການນີ້ ເຈົ້າສາມາດ:\n- ອັບເດດ Aseprite ເປັນເວີຊັນລ່າສຸດ ແລະ ລອງໂຫຼດໄຟລ໌ອີກຄັ້ງ (ແນະນຳ), ຫຼື\n- ໃຊ້ຕົວເລືອກ "ໄຟລ໌ > ບັນທຶກເປັນ" ເພື່ອບັນທຶກໄຟລ໌ດ້ວຍຊື່ອື່ນ (ເຈົ້າຈະສູນເສຍຂໍ້ມູນທີ່ເກັບໄວ້ໃນໄຟລ໌ຕົ້ນສະບັບຢູ່ດີ)
