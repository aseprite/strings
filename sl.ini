message = Te datoteke ni mogoče v celoti prebrati. Morda je bila ustvarjena z novejšo različico programa Aseprite, poškodovana je ali pa je narejena tako, da povzroči sesutje programa Aseprite.\n\nOznačena bo kot samo za branje, da se prepreči izguba podatkov v primeru, da jo poskusite shraniti in prepisati.\n\nTo situacijo lahko rešite na naslednji način:\n- Posodobite Aseprite na najnovejšo različico in poskusite znova naložiti datoteko (priporočeno) ali\n- Uporabite možnost »Datoteka > Shrani kot«, da datoteko shranite z drugim imenom (v vsakem primeru boste izgubili podatke, shranjene v izvirni datoteki)

